<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Nihongo Scan</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light dark;--bg:#faf8f5;--card:#fff;--fg:#1d1b19;--mut:#6f6a63;--ac:#c2410c;--acf:#fff;--ok:#15803d;--okb:#dcfce7;--bad:#b91c1c;--badb:#fee2e2;--bd:#e7e2da;--nw:#2563eb;--fm:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#232019;--fg:#f3efe9;--mut:#a39d93;--ac:#fb923c;--acf:#1d1b19;--ok:#4ade80;--okb:#14351f;--bad:#f87171;--badb:#3d1717;--bd:#38342c;--nw:#60a5fa;--fm:#fbbf24}}
:root[data-theme="dark"]{--bg:#171513;--card:#232019;--fg:#f3efe9;--mut:#a39d93;--ac:#fb923c;--acf:#1d1b19;--ok:#4ade80;--okb:#14351f;--bad:#f87171;--badb:#3d1717;--bd:#38342c;--nw:#60a5fa;--fm:#fbbf24}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;max-width:560px;margin:0 auto;padding:16px 16px 92px;min-height:100vh}
h1{font-size:22px;margin:4px 0 2px}p.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;padding:14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);font-weight:600;margin-bottom:10px;text-align:center}
.btn.pri{background:var(--ac);color:var(--acf);border-color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;padding:12px 4px;background:none;border:0;color:var(--mut);font-size:13px}
nav button b{display:block;font-size:20px}nav button.on{color:var(--ac);font-weight:700}
.w{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}.w:last-child{border:0}
.k{font-size:24px;font-weight:700;min-width:96px}.k rt{font-size:11px;font-weight:400;color:var(--mut)}
.m{flex:1;color:var(--mut);font-size:15px}.sp{border:0;background:none;font-size:20px}
.opt{display:block;width:100%;text-align:left;padding:14px;margin-bottom:10px;border:1px solid var(--bd);border-radius:12px;background:var(--card);font-size:18px}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.bad{background:var(--badb);border-color:var(--bad)}
.big{font-size:44px;font-weight:800;text-align:center;margin:12px 0 4px}.cap{text-align:center;color:var(--mut);font-size:14px;margin-bottom:16px}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--ac)}
.seg{display:flex;gap:8px;margin-bottom:12px}.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font-size:14px}.seg button.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
.txt{background:var(--bg);border-radius:10px;padding:10px;font-size:18px;line-height:2.4;white-space:pre-wrap;max-height:60vh;overflow:auto}.txt rt{font-size:10px;color:var(--mut)}.tk{cursor:pointer;border-radius:4px}.tk:active{background:var(--bd)}.pop{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--ac);position:sticky;bottom:84px}
.bd{padding:3px 10px;border-radius:999px;border:1px solid currentColor;font-size:12px;font-weight:600;background:none}.bd.new,.sb.new{color:var(--nw)}.bd.fam,.sb.fam{color:var(--fm)}.bd.learnt,.sb.learnt{color:var(--ok)}
.stp{display:flex;gap:8px;padding:0 0 12px}.sb{flex:1;padding:12px 4px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-size:15px;font-weight:600}.sb.on{box-shadow:inset 0 0 0 2px currentColor}
.fc{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.note{color:var(--mut);font-size:13px}.err{color:var(--bad);font-size:14px;margin:8px 0}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:r .8s linear infinite;vertical-align:-3px;margin-right:8px}@keyframes r{to{transform:rotate(360deg)}}
input[type=file]{display:none}
textarea{width:100%;min-height:96px;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;resize:vertical;margin-bottom:10px}
</style></head><body>
<div id="app"></div>
<nav><div id="nav"></div></nav>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let words=[],tab='scan',sample=null,busy=null,error='',ocr='',Q=null,wf='all',wsort=false,wopen=-1,rev={f:'all',i:0,flip:false,deck:[]},tx=0;
const S=['new','fam','learnt'],WF=['all','new','fam','learnt'],LBL={new:'New',fam:'Familiar',learnt:'Learnt'},ORD={new:0,fam:1,learnt:2};
const st=w=>w.st||'new';
const quizPool=()=>uniq().filter(w=>st(w)!=='learnt');
function setSt(w,s){w.st=s;w.streak=0;save()}
const sb=(cur,fn)=>S.map((s,n)=>`<button class='sb ${s} ${cur===s?'on':''}' onclick='${fn(n)}'>${LBL[s]}</button>`).join('');
try{words=JSON.parse(localStorage.getItem('ns_words')||'[]')}catch(e){}
const uniq=()=>{const m=new Map();words.forEach(w=>{if(!m.has(w.kanji))m.set(w.kanji,w)});return[...m.values()]};
const save=()=>{try{localStorage.setItem('ns_words',JSON.stringify(words))}catch(e){}};
/* ---------- Free engine: Tesseract (OCR) + Kuromoji (words, furigana) + JMdict (meanings) ---------- */
let tkv=null,tk=null,dict=null,dix=null,kix=null,doc=[],pop=null;
const hira=s=>(s||'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
const hasK=s=>/[\u4e00-\u9fff々]/.test(s);
/* kuromoji's option is dicPath; absolute URLs get mangled by its path.join, so we use a marker and rewrite it in XHR */
let DICT_BASE='';
const _xo=XMLHttpRequest.prototype.open;
XMLHttpRequest.prototype.open=function(m,u,...r){if(typeof u==='string'&&u.startsWith('KURODICT/'))u=DICT_BASE+u.slice(9);return _xo.call(this,m,u,...r)};
const DICTS=['https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/','https://unpkg.com/kuromoji@0.1.2/dict/','https://cdn.jsdelivr.net/gh/takuyaa/kuromoji.js@master/dict/'];
const loadTk=()=>tk||(tk=(async()=>{let last;for(const d of DICTS){try{return await withTimeout(new Promise((ok,no)=>(DICT_BASE=d,kuromoji.builder({dicPath:'KURODICT/'})).build((e,t)=>e?no(e):(tkv=t,ok(t)))),40000,'Word splitter ('+new URL(d).host+')')}catch(e){last=e}}throw last})());
let dictMsg='';
const tick=()=>new Promise(r=>setTimeout(r));
const loadDict=()=>dict||(dict=(async()=>{
  try{
    const r=await fetch('data/jmdict.json');if(!r.ok)return null;
    busy='Loading dictionary…';render();
    const txt=await r.text();
    if(txt.length>60e6){dictMsg='data/jmdict.json is the FULL dictionary ('+Math.round(txt.length/1e6)+' MB) and is too big for a phone. Use the jmdict-eng-common file instead.';return null}
    const j=JSON.parse(txt);await tick();
    const d=new Map(),k2=new Map();let n=0;
    for(const e of j.words){
      const m=e.sense.slice(0,2).map(x=>x.gloss.slice(0,2).map(g=>g.text).join(', ')).join('; '),o={r:e.kana[0].text,m};
      for(const k of e.kanji||[]){if(!d.has(k.text))d.set(k.text,o);for(const c of k.text)if(hasK(c)){let a=k2.get(c);if(!a)k2.set(c,a=[]);if(a.length<40)a.push(o)}}
      for(const k of e.kana)if(!d.has(k.text))d.set(k.text,o);
      if(++n%3000===0){busy='Loading dictionary… '+Math.round(n/j.words.length*100)+'%';render();await tick()}
    }
    dix=d;kix=k2;return true
  }catch(e){return null}
  finally{if(busy&&busy.startsWith('Loading dictionary'))busy=null;render()}
})());
function furiTok(t){const s=t.surface_form;if(!hasK(s)||!t.reading||t.reading==='*')return s;
  let r=hira(t.reading),a=s,suf='',pre='';
  while(a.length>1&&r.length>1&&!hasK(a.at(-1))&&a.at(-1)===r.at(-1)){suf=a.at(-1)+suf;a=a.slice(0,-1);r=r.slice(0,-1)}
  while(a.length>1&&r.length>1&&!hasK(a[0])&&a[0]===r[0]){pre+=a[0];a=a.slice(1);r=r.slice(1)}
  return pre+'{'+a+'|'+r+'}'+suf}
const withTimeout=(p,ms,label)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error(label+' took longer than '+ms/1000+' s and was stopped. Check your connection and try again.')),ms))]);
window.addEventListener('error',e=>{if(busy){error='Script error: '+e.message;busy=null;render()}});
const WORDPOS=['名詞','動詞','形容詞','副詞'];
async function scan(f,text){
  if(!f&&!text)return;error='';
  try{
    if(f){busy='Reading the image (the first time it downloads language data)…';render();
      let lp=-1;const r=await withTimeout(Tesseract.recognize(f,'jpn',{logger:m=>{const q=Math.round((m.progress||0)*100);if(q!==lp){lp=q;busy='Reading the image: '+m.status+' '+q+'%';render()}}}),240000,'Reading the image');
      text=r.data.text.replace(/(?<=[\u3000-\u9fff]) +(?=[\u3000-\u9fff])/g,'')}
    busy='Splitting words and adding furigana…';render();
    busy='Loading the word splitter (first time ~10-30 s)…';render();
    const t=await withTimeout(loadTk(),150000,'Loading the word splitter');
    await withTimeout(loadDict(),90000,'Loading the dictionary');
    const toks=t.tokenize(text);
    if(!toks.some(k=>hasK(k.surface_form)))throw new Error('No kanji text found. Try a sharper photo, or copy the text with Google Lens and paste it.');
    doc=toks.map(k=>({s:k.surface_form,f:furiTok(k),b:k.basic_form,r:k.reading}));pop=null;
    words=uniq();const seen=new Set(words.map(w=>w.kanji));
    for(const k of toks){
      if(!hasK(k.surface_form)||!WORDPOS.includes(k.pos)||['非自立','接尾','数'].includes(k.pos_detail_1))continue;
      const b=k.basic_form&&k.basic_form!=='*'?k.basic_form:k.surface_form;
      if(!hasK(b)||seen.has(b))continue;seen.add(b);
      const e=dix&&dix.get(b);
      words.push({kanji:b,reading:e?e.r:hira(k.reading),meaning:e?e.m:'—',distractors:[]});
    }
    save();tab='words';
  }catch(e){error=e.message||'Something went wrong.';if(!tkv)tk=null}
  busy=null;render();
}
function tap(i){const t=doc[i],b=t.b&&t.b!=='*'?t.b:t.s,e=dix&&(dix.get(b)||dix.get(t.s));
  pop={s:t.s,b,r:e?e.r:hira(t.r),m:e?e.m:'(no dictionary entry)'};render()}
const popCard=()=>`<div class="pop"><div style="font-size:22px;font-weight:700">${esc(pop.b)}${pop.b!==pop.s?` <span class="note">(${esc(pop.s)})</span>`:''}</div><div>${esc(pop.r)}</div><div class="note" style="font-size:15px">${esc(pop.m)}</div></div>`;
render();loadDict();

const DEMO=[["準備","じゅんび","preparation",["arrangement","planning","practice"]],["経験","けいけん","experience",["experiment","examination","management"]],["約束","やくそく","promise",["reservation","contract","condition"]],["注意","ちゅうい","caution, attention",["intention","meaning","opinion"]],["会議","かいぎ","meeting",["society","council election","discussion class"]],["場合","ばあい","case, situation",["place","combination","opportunity"]],["意味","いみ","meaning",["interest","attention","sense of taste"]],["習慣","しゅうかん","habit, custom",["learning","weekly magazine","exchange"]]].map(([kanji,reading,meaning,distractors])=>({kanji,reading,meaning,distractors}));

/* ---------- OCR + segmentation via Claude vision ---------- */
async function shrink(f){const u=URL.createObjectURL(f);const im=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=u});const k=Math.min(1,1600/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);return new Promise(r=>c.toBlob(r,'image/jpeg',.85))}

/* ---------- Distractor logic ---------- */
const VG=['かが','きぎ','くぐ','けげ','こご','さざ','しじ','すず','せぜ','そぞ','ただ','ちぢ','つづ','てで','とど','はばぱ','ひびぴ','ふぶぷ','へべぺ','ほぼぽ'];
const ROW={a:'あかがさざただなはばぱまやらわゃ',i:'いきぎしじちぢにひびぴみり',u:'うくぐすずつづぬふぶぷむゆるゅ',e:'えけげせぜてでねへべぺめれ',o:'おこごそぞとどのほぼぽもよろをょ'};
const longV=c=>ROW.a.includes(c)?'あ':(ROW.i.includes(c)||ROW.e.includes(c))?'い':(ROW.u.includes(c)||ROW.o.includes(c))?'う':null;
function readingDistractors(r,pool){
  const out=new Set(),ch=[...r],add=s=>{if(s&&s!==r)out.add(s)};
  ch.forEach((c,i)=>{const g=VG.find(x=>x.includes(c));if(g)for(const o of g)if(o!==c){const t=ch.slice();t[i]=o;add(t.join(''))}});       // voiced / unvoiced
  ch.forEach((c,i)=>{const v=longV(c);if(v&&c!=='っ'&&!'ゃゅょっ'.includes(ch[i+1]||'x')&&!'ういあ'.includes(ch[i+1]||'x')){const t=ch.slice();t.splice(i+1,0,v);add(t.join(''))}}); // add long vowel
  ch.forEach((c,i)=>{if(i>0&&'ういあ'.includes(c)&&longV(ch[i-1])===c){const t=ch.slice();t.splice(i,1);add(t.join(''))}});               // drop long vowel
  ch.forEach((c,i)=>{if(i>0&&'きしちにひみりぎじ'.includes(ch[i-1])&&'ゃゅょ'.includes(c)){const t=ch.slice();t.splice(i,1);add(t.join(''))}}); // contracted sound
  ch.forEach((c,i)=>{if(i>0&&i<ch.length&&'かきくけこさしすせそたちつてとぱぴぷぺぽ'.includes(c)&&ch[i-1]!=='っ'){const t=ch.slice();t.splice(i,0,'っ');add(t.join(''))}}); // sokuon
  let arr=shuf([...out]).slice(0,3);
  for(const w of shuf(pool)){if(arr.length>=3)break;if(w.reading!==r&&!arr.includes(w.reading))arr.push(w.reading)}
  return arr;
}
function meaningDistractors(w){
  const a=[],add=m=>{if(m&&m!=='—'&&m!==w.meaning&&!a.includes(m))a.push(m)};
  if(kix)for(const c of w.kanji)for(const o of shuf(kix.get(c)||[]))if(a.length<2)add(o.m);
  for(const o of shuf(uniq()))if(a.length<3)add(o.meaning);
  if(dix&&a.length<3)for(const o of shuf([...dix.values()].slice(0,800)))if(a.length<3)add(o.m);
  return a.slice(0,3);
}
function buildQuiz(kind){
  const pick=shuf(quizPool()).slice(0,10);
  return{kind,i:0,score:0,done:false,sel:null,qs:pick.map((w,n)=>{
    const t=kind==='mixed'?(n%2?'meaning':'reading'):kind;
    const ans=t==='reading'?w.reading:w.meaning;
    const ds=t==='reading'?readingDistractors(w.reading,uniq()):meaningDistractors(w);
    return{w,t,ans,opts:shuf([ans,...ds])};
  })};
}

/* ---------- UI ---------- */
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';speechSynthesis.speak(u)}catch(e){}}
const furi=s=>esc(s).replace(/\{([^|{}]+)\|([^{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');
const ruby=w=>`<ruby>${esc(w.kanji)}<rt>${esc(w.reading)}</rt></ruby>`;
function render(){
  $('#nav').innerHTML=[['scan','📷','Scan'],['words','📖','Words'],['quiz','🎯','Quiz'],['rev','🔁','Revise']].map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><b>${i}</b>${l}</button>`).join('');
  $('#app').innerHTML=tab==='scan'?vScan():tab==='words'?vWords():tab==='rev'?vRev():vQuiz();
}
const go=t=>{tab=t;error='';if(t==='rev')buildDeck();render()};
function vScan(){return`<h1>Scan Japanese text</h1><p class="sub">Photograph a page, sign or menu, or pick an image from your gallery.</p>
<label class="btn pri">📷 Take a photo<input type="file" accept="image/*" capture="environment" onchange="scan(this.files[0])"></label>
<label class="btn">🖼️ Choose from gallery<input type="file" accept="image/*" onchange="scan(this.files[0])"></label>
${busy?`<div class="card"><span class="spin"></span>${busy}</div>`:''}${error?`<div class="err">${esc(error)}</div>`:''}
<div class="card"><div class="note" style="margin-bottom:8px">Or paste Japanese text</div><textarea id="pt" placeholder="日本語のテキストをここに貼り付け…"></textarea><button class="btn pri" style="margin:0" onclick="scan(null,document.getElementById('pt').value.trim())">Analyse pasted text</button></div>
<button class="btn" onclick="demo()">Try with demo words</button>
<p class="note">Tip: for the best accuracy, copy the text with Google Lens and paste it below. Kanji, hiragana and katakana are detected, split into vocabulary, and turned into quizzes. ${words.length?`You have ${words.length} saved words.`:''}</p>`}
function demo(){const s=new Set(words.map(w=>w.kanji));DEMO.forEach(w=>{if(!s.has(w.kanji))words.push(w)});save();tab='words';render()}
function vWords(){
  if(!words.length)return`<h1>Words</h1><p class="sub">Nothing here yet. Scan some text first.</p><button class="btn pri" onclick="go('scan')">Go to Scan</button>`;
  return`<h1>Vocabulary</h1><p class="sub">${words.length} unique words</p>${dix?'':`<p class="err">${esc(dictMsg||'Dictionary file data/jmdict.json not found, so meanings are empty. See README.')}</p>`}
${doc.length?`<div class="card"><div class="note">Text with furigana · tap a word for its meaning</div><div class="txt">${doc.map((t,i)=>`<span class="tk" onclick="tap(${i})">${furi(t.f)}</span>`).join('')}</div>${pop?popCard():''}</div>`:''}
<div class='seg'>${WF.map((k,n)=>`<button class='${wf===k?'on':''}' onclick='setWF(${n})'>${k==='all'?'All':LBL[k]} ${k==='all'?words.length:words.filter(w=>st(w)===k).length}</button>`).join('')}<button class='${wsort?'on':''}' onclick='wsort=!wsort;render()'>Sort ↕</button></div>
<div class='card' style='padding:4px 16px'>${wlist()||'<p class=note>No words with this status.</p>'}</div>
<button class="btn pri" onclick="startQuiz('mixed')">Quiz me on these</button>
<button class="btn" onclick="if(confirm('Clear all words?')){words=[];ocr='';Q=null;save();render()}">Clear list</button>`}
const setWF=n=>{wf=WF[n];wopen=-1;render()};
const chg=(i,n)=>{setSt(words[i],S[n]);wopen=-1;render()};
function wlist(){let a=words.map((w,i)=>({w,i})).filter(x=>wf==='all'||st(x.w)===wf);if(wsort)a.sort((p,q)=>ORD[st(p.w)]-ORD[st(q.w)]);
  return a.map(({w,i})=>`<div class='w'><div class='k'>${ruby(w)}</div><div class='m'>${esc(w.meaning)}</div><button class='bd ${st(w)}' onclick='wopen=wopen===${i}?-1:${i};render()'>${LBL[st(w)]}</button><button class='sp' onclick='speak(words[${i}].kanji)' aria-label='Play'>🔊</button></div>${wopen===i?`<div class='stp'>${sb(st(w),n=>`chg(${i},${n})`)}</div>`:''}`).join('')}
function buildDeck(){rev.deck=words.filter(w=>rev.f==='all'||st(w)===rev.f);rev.i=0;rev.flip=false}
const setRF=n=>{rev.f=WF[n];buildDeck();render()};
const mv=d=>{rev.i=Math.max(0,rev.i+d);rev.flip=false;render()};
const sw=d=>{if(d<-50)mv(1);else if(d>50&&rev.i>0)mv(-1)};
const mark=n=>{setSt(rev.deck[rev.i],S[n]);mv(1)};
function vRev(){
  const h=`<h1>Revise</h1><p class='sub'>Tap the card to flip, then mark how well you know the word.</p><div class='seg'>${WF.map((k,n)=>`<button class='${rev.f===k?'on':''}' onclick='setRF(${n})'>${k==='all'?'All':LBL[k]}</button>`).join('')}</div>`;
  if(!rev.deck.length)return h+`<div class='card'><p class='note' style='text-align:center;margin:0'>${words.length?'No words with this status.':'Scan some text to build your deck.'}</p></div>`;
  if(rev.i>=rev.deck.length)return h+`<div class='card' style='text-align:center'><div class='big' style='font-size:32px'>Deck finished 🎉</div><p class='note'>${rev.deck.length} cards reviewed</p></div><button class='btn pri' onclick='buildDeck();render()'>Start again</button>`;
  const w=rev.deck[rev.i];
  return h+`<div class='note' style='text-align:center;margin-bottom:6px'>${rev.i+1} / ${rev.deck.length} · swipe to move on</div>
<div class='card fc' onclick='rev.flip=!rev.flip;render()' ontouchstart='tx=event.touches[0].clientX' ontouchend='sw(event.changedTouches[0].clientX-tx)'>${rev.flip?`<div style='font-size:30px;font-weight:700'>${esc(w.reading)}</div><div style='margin-top:8px;font-size:18px'>${esc(w.meaning)}</div>`:`<div class='big' style='font-size:56px;margin:0'>${esc(w.kanji)}</div><div class='note'>tap to flip</div>`}</div>
<div class='stp'>${sb(st(w),n=>`mark(${n})`)}</div>
<div class='stp'><button class='sb' onclick='mv(-1)'>‹ Back</button><button class='sb' onclick='speak(rev.deck[rev.i].kanji)'>🔊</button><button class='sb' onclick='mv(1)'>Skip ›</button></div>`}
function startQuiz(k){if(words.length<2||!quizPool().length){Q=null;error=words.length<2?'Add a few more words first.':'All your words are marked Learnt, so there is nothing to quiz. Change a status in Words or Revise.';tab='quiz';return render()}Q=buildQuiz(k);tab='quiz';render()}
function vQuiz(){
  const seg=`<div class="seg">${[['reading','Reading'],['meaning','Meaning'],['mixed','Mixed']].map(([k,l])=>`<button class="${Q&&Q.kind===k?'on':''}" onclick="startQuiz('${k}')">${l}</button>`).join('')}</div>`;
  if(!words.length)return`<h1>Quiz</h1><p class="sub">Scan text to generate a quiz.</p><button class="btn pri" onclick="go('scan')">Go to Scan</button>`;
  if(!Q)return`<h1>Quiz</h1><p class="sub">Quizzes use New and Familiar words only.</p>${seg}${error?`<div class='err'>${esc(error)}</div>`:''}`;
  if(Q.done)return`<h1>Done!</h1><div class="card"><div class="big">${Q.score} / ${Q.qs.length}</div><div class="cap">${Q.score===Q.qs.length?'Perfect score!':Q.score>=Q.qs.length*.7?'Nice work.':'Keep practising.'}</div></div>${seg}<button class="btn pri" onclick="startQuiz('${Q.kind}')">Play again</button>`;
  const q=Q.qs[Q.i];
  return`${seg}<div class="bar"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>
<div class="card"><div class="cap">${q.t==='reading'?'What is the reading?':'What does it mean?'} · ${Q.i+1}/${Q.qs.length}</div><div class="big">${esc(q.w.kanji)}</div></div>
${q.opts.map((o,n)=>{let c='';if(Q.sel!==null){if(o===q.ans)c='ok';else if(n===Q.sel)c='bad'}return`<button class="opt ${c}" ${Q.sel!==null?'disabled':''} onclick="pick(${n})"><b>${'ABCD'[n]}</b> &nbsp;${esc(o)}</button>`}).join('')}
${Q.sel!==null?`<p class="note" style="text-align:center">${esc(q.w.kanji)} = ${esc(q.w.reading)} · ${esc(q.w.meaning)}</p>${Q.ask?`<div class='card'><p style='margin:0 0 12px;text-align:center'>You’ve got this one 3 times in a row. Mark as Learnt?</p><div class='stp' style='padding:0'><button class='sb learnt' onclick='resolve(true)'>Mark as Learnt</button><button class='sb' onclick='resolve(false)'>Not yet</button></div></div>`:`<button class="btn pri" onclick="next()">${Q.i+1<Q.qs.length?'Next':'See results'}</button>`}`:''}`}
function pick(n){const q=Q.qs[Q.i],w=q.w;Q.sel=n;
  if(q.opts[n]===q.ans){Q.score++;w.streak=(w.streak||0)+1;Q.ask=st(w)!=='learnt'&&w.streak>=3}else{w.streak=0;Q.ask=false}
  save();render()}
function resolve(yes){const w=Q.qs[Q.i].w;if(yes)w.st='learnt';w.streak=0;Q.ask=false;save();render()}
function next(){Q.sel=null;Q.i++;if(Q.i>=Q.qs.length)Q.done=true;render()}
render();
