  ch.forEach((c,i)=>{if(i>0&&i<ch.length&&'かきくけこさしすせそたちつてとぱぴぷぺぽ'.includes(c)&&ch[i-1]!=='っ'){const t=ch.slice();t.splice(i,0,'っ');add(t.join(''))}}); // sokuon

const row=(w,i)=>`<div class='w'><div class='k'>${ruby(w)}</div><div class='m'>${lvOf(w)?`<span class='lvt'>${lvOf(w)}</span> `:''}${esc(w.meaning)}</div><button class='bd ${st(w)}' onclick='wopen=wopen===${i}?-1:${i};render()'>${LBL[st(w)]}</button><button class='sp' onclick='speak(words[${i}].kanji)' aria-label='Play'>🔊</button></div>${wopen===i?`<div class='stp'>${sb(st(w),n=>`chg(${i},${n})`)}</div><div class='stp'>${TH.map((t,n)=>`<button class='sb ${(w.th||autoTheme(w))===t.n?'on':''}' onclick='setTh(${i},${n})'>${t.s}</button>`).join('')}<button class='sb' onclick='delW(${i})'>🗑</button></div><div style='padding:0 0 12px'>${kdet(w.kanji)}</div>`:''}`;
function wlist(){
  const a=shown();if(!a.length)return'';
  if(gb==='none')return a.map(x=>row(x.w,x.i)).join('');
  const key=w=>gb==='lv'?(lvOf(w)||'Not in JLPT list'):gb==='pos'?(w.pos||'Other'):subj(w);
  const g=new Map();a.forEach(x=>{const k=key(x.w);if(!g.has(k))g.set(k,[]);g.get(k).push(x)});
  let ks=[...g.keys()];
  if(gb==='lv')ks.sort((x,y)=>(LV.indexOf(x)<0?9:LV.indexOf(x))-(LV.indexOf(y)<0?9:LV.indexOf(y)));
  else if(gb==='pos')ks.sort((x,y)=>POSL.indexOf(x)-POSL.indexOf(y));
  else ks.sort();
  return ks.map(k=>`<div class='note' style='margin:14px 0 2px;font-weight:700'>${esc(k)} · ${g.get(k).length}</div>`+g.get(k).map(x=>row(x.w,x.i)).join('')).join('')}
const optH=(arr,c)=>arr.map(([v,l])=>`<option value='${esc(v)}' ${v===c?'selected':''}>${esc(l)}</option>`).join('');
function filterUI(){
  const fsO=[...new Set(words.map(w=>subj(w)))].sort();
  return `<div class='seg'><select onchange='fl=this.value;render()'>${optH([['all','All levels'],...LV.map(l=>[l,l]),['none','Not in JLPT list']],fl)}</select><select onchange='fp=this.value;render()'>${optH([['all','All types'],...POSL.map(p=>[p,p])],fp)}</select></div>
<div class='seg'><select onchange='fs=this.value;render()'>${optH([['all','All themes'],...fsO.map(x=>[x,x])],fs)}</select><select onchange='gb=this.value;render()'>${optH([['none','No grouping'],['lv','Group by JLPT level'],['pos','Group by type'],['f','Group by theme']],gb)}</select></div>
${jl?'':`<p class='note'>JLPT levels could not be loaded (needs an internet connection).</p>`}
<div class='stp' style='align-items:center'><span class='note' style='flex:none'>Mark shown as</span>${S.map((s,n)=>`<button class='sb ${s}' onclick='bulk(${n})'>${LBL[s]}</button>`).join('')}</div>`}
function bulk(n){const a=shown();if(!a.length)return;if(!confirm('Mark '+a.length+' shown words as '+LBL[S[n]]+'?'))return;a.forEach(x=>{x.w.st=S[n];x.w.streak=0});save();render()}
function buildDeck(){rev.deck=words.filter(w=>rev.f==='all'||st(w)===rev.f);rev.i=0;rev.flip=false}
const setRF=n=>{rev.f=WF[n];buildDeck();render()};
const mv=d=>{rev.i=Math.max(0,rev.i+d);rev.flip=false;render()};
const sw=d=>{if(d<-50)mv(1);else if(d>50&&rev.i>0)mv(-1)};
const mark=n=>{setSt(rev.deck[rev.i],S[n]);mv(1)};
function vRev(){
  const h=`<h1>Revise</h1><p class='sub'>Tap the card to flip, then mark how well you know the word.</p><div class='seg'>${WF.map((k,n)=>`<button class='${rev.f===k?'on':''}' onclick='setRF(${n})'>${k==='all'?'All':LBL[k]}</button>`).join('')}</div>`;
  if(!rev.deck.length)return h+`<div class='card'><p class='note' style='text-align:center;margin:0'>${words.length?'No words with this status.':'Scan some text to build your deck.'}</p></div>`;
  if(rev.i>=rev.deck.length)return h+`<div class='card' style='text-align:center'><div class='big' style='font-size:32px'>Deck finished 🎉</div><p class='note'>${rev.deck.length} cards reviewed</p></div><button class='btn pri' onclick='buildDeck();render()'>Start again</button>`;
  const w=rev.deck[rev.i];
  return h+`<div class='note' style='text-align:center;margin-bottom:6px'>${rev.i+1} / ${rev.deck.length} · swipe to move on</div>
<div class='card fc' onclick='rev.flip=!rev.flip;render()' ontouchstart='tx=event.touches[0].clientX' ontouchend='sw(event.changedTouches[0].clientX-tx)'>${rev.flip?`<div style='font-size:30px;font-weight:700'>${esc(w.reading)}</div><div style='margin-top:8px;font-size:18px'>${esc(w.meaning)}</div>`:`<div class='big' style='font-size:56px;margin:0'>${esc(w.kanji)}</div><div class='note'>tap to flip</div>`}</div>
<div class='stp'>${sb(st(w),n=>`mark(${n})`)}</div>
<div class='stp'><button class='sb' onclick='mv(-1)'>‹ Back</button><button class='sb' onclick='speak(rev.deck[rev.i].kanji)'>🔊</button><button class='sb' onclick='mv(1)'>Skip ›</button></div>`}
function startQuiz(k){if(words.length<2||!quizPool().length){Q=null;error=words.length<2?'Add a few more words first.':'All your words are marked Learnt, so there is nothing to quiz. Change a status in Words or Revise.';tab='quiz';return render()}Q=buildQuiz(k);tab='quiz';render()}
function vQuiz(){
  const seg=`<div class="seg">${[['reading','Reading'],['meaning','Meaning'],['mixed','Mixed']].map(([k,l])=>`<button class="${Q&&Q.kind===k?'on':''}" onclick="startQuiz('${k}')">${l}</button>`).join('')}</div>`;
  if(!words.length)return`<h1>Quiz</h1><p class="sub">Scan text to generate a quiz.</p><button class="btn pri" onclick="go('scan')">Go to Scan</button>`;
  if(!Q)return`<h1>Quiz</h1><p class="sub">Quizzes use New and Familiar words only.</p>${seg}${error?`<div class='err'>${esc(error)}</div>`:''}`;
  if(Q.done)return`<h1>Done!</h1><div class="card"><div class="big">${Q.score} / ${Q.qs.length}</div><div class="cap">${Q.score===Q.qs.length?'Perfect score!':Q.score>=Q.qs.length*.7?'Nice work.':'Keep practising.'}</div></div>${seg}<button class="btn pri" onclick="startQuiz('${Q.kind}')">Play again</button>`;
  const q=Q.qs[Q.i];
  return`${seg}<div class="bar"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>
<div class="card"><div class="cap">${q.t==='reading'?'What is the reading?':'What does it mean?'} · ${Q.i+1}/${Q.qs.length}</div><div class="big">${esc(q.w.kanji)}</div></div>
${q.opts.map((o,n)=>{let c='';if(Q.sel!==null){if(o===q.ans)c='ok';else if(n===Q.sel)c='bad'}return`<button class="opt ${c}" ${Q.sel!==null?'disabled':''} onclick="pick(${n})"><b>${'ABCD'[n]}</b> &nbsp;${esc(o)}</button>`}).join('')}
${Q.sel!==null?`<p class="note" style="text-align:center">${esc(q.w.kanji)} = ${esc(q.w.reading)} · ${esc(q.w.meaning)}</p>${Q.ask?`<div class='card'><p style='margin:0 0 12px;text-align:center'>You’ve got this one 3 times in a row. Mark as Learnt?</p><div class='stp' style='padding:0'><button class='sb learnt' onclick='resolve(true)'>Mark as Learnt</button><button class='sb' onclick='resolve(false)'>Not yet</button></div></div>`:`<button class="btn pri" onclick="next()">${Q.i+1<Q.qs.length?'Next':'See results'}</button>`}`:''}`}
function pick(n){const q=Q.qs[Q.i],w=q.w;Q.sel=n;
  if(q.opts[n]===q.ans){Q.score++;w.streak=(w.streak||0)+1;Q.ask=st(w)!=='learnt'&&w.streak>=3}else{w.streak=0;Q.ask=false}
  save();render()}
function resolve(yes){const w=Q.qs[Q.i].w;if(yes)w.st='learnt';w.streak=0;Q.ask=false;save();render()}
function next(){Q.sel=null;Q.i++;if(Q.i>=Q.qs.length)Q.done=true;render()}
render();
